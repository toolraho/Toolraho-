<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF - Toolraho</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f8ff;
    color:#102044;
}

header{
    background:white;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#1557d6;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:#102044;
    font-weight:bold;
}

.container{
    max-width:850px;
    margin:55px auto;
    padding:0 20px;
}

h1{
    text-align:center;
    font-size:38px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:35px;
}

.card{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(30,60,120,.12);
}

.upload{
    border:2px dashed #8aa4d8;
    padding:35px 20px;
    text-align:center;
    border-radius:14px;
    background:#f8faff;
    margin-bottom:25px;
}

input[type=file]{
    margin-top:15px;
    width:100%;
}

.info{
    margin:15px 0;
    font-weight:bold;
    color:#1557d6;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input[type=text]{
    width:100%;
    padding:14px;
    border:1px solid #ccd5e5;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d52bb;
}

button:disabled{
    background:#9aa8bd;
    cursor:not-allowed;
}

.message{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

footer{
    margin-top:80px;
    background:#17346f;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:600px){
    h1{font-size:30px}
    header{padding:16px 5%}
    .logo{font-size:23px}
    nav a{margin-left:10px;font-size:14px}
    .card{padding:20px}
}
</style>
</head>

<body>

<header>
    <div class="logo">Toolraho</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="pdf.html">PDF Tools</a>
    </nav>
</header>

<div class="container">

    <h1>Split PDF</h1>
    <p class="subtitle">
        Extract selected pages from a PDF and create a new PDF easily.
    </p>

    <div class="card">

        <div class="upload">
            <strong>📄 Select your PDF file</strong>
            <br>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>

        <div class="info" id="fileInfo"></div>

        <label for="pages">
            Pages to extract
        </label>

        <input
            type="text"
            id="pages"
            placeholder="Example: 1-3 or 1,3,5"
        >

        <button id="splitBtn" disabled>
            Split PDF
        </button>

        <div class="message" id="message"></div>

    </div>

</div>

<footer>
    © 2026 Toolraho. All rights reserved.
</footer>

<script>
const fileInput = document.getElementById("pdfFile");
const pagesInput = document.getElementById("pages");
const splitBtn = document.getElementById("splitBtn");
const fileInfo = document.getElementById("fileInfo");
const message = document.getElementById("message");

let selectedFile = null;

fileInput.addEventListener("change", async function(){

    selectedFile = this.files[0];

    if(!selectedFile){
        splitBtn.disabled = true;
        fileInfo.textContent = "";
        return;
    }

    if(selectedFile.type !== "application/pdf"){
        message.textContent = "Please select a PDF file.";
        splitBtn.disabled = true;
        return;
    }

    try{
        const bytes = await selectedFile.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(bytes);

        fileInfo.textContent =
            "✅ " + selectedFile.name +
            " — " + pdf.getPageCount() + " pages";

        message.textContent = "";
        splitBtn.disabled = false;

    }catch(error){
        message.textContent = "Unable to read this PDF.";
        splitBtn.disabled = true;
    }
});

function getPageNumbers(text, totalPages){

    let pages = [];

    const parts = text.split(",");

    for(let part of parts){

        part = part.trim();

        if(part.includes("-")){

            const range = part.split("-");

            if(range.length !== 2) return null;

            const start = parseInt(range[0]);
            const end = parseInt(range[1]);

            if(
                isNaN(start) ||
                isNaN(end) ||
                start < 1 ||
                end > totalPages ||
                start > end
            ){
                return null;
            }

            for(let i=start; i<=end; i++){
                pages.push(i);
            }

        }else{

            const page = parseInt(part);

            if(
                isNaN(page) ||
                page < 1 ||
                page > totalPages
            ){
                return null;
            }

            pages.push(page);
        }
    }

    pages = [...new Set(pages)];

    return pages.length ? pages : null;
}

splitBtn.addEventListener("click", async function(){

    if(!selectedFile) return;

    message.textContent = "⏳ Creating your new PDF...";
    splitBtn.disabled = true;

    try{

        const bytes = await selectedFile.arrayBuffer();

        const sourcePdf =
            await PDFLib.PDFDocument.load(bytes);

        const totalPages =
            sourcePdf.getPageCount();

        const pageNumbers =
            getPageNumbers(
                pagesInput.value,
                totalPages
            );

        if(!pageNumbers){

            message.textContent =
                "❌ Please enter valid page numbers.";

            splitBtn.disabled = false;
            return;
        }

        const newPdf =
            await PDFLib.PDFDocument.create();

        const copiedPages =
            await newPdf.copyPages(
                sourcePdf,
                pageNumbers.map(p => p - 1)
            );

        copiedPages.forEach(page => {
            newPdf.addPage(page);
        });

        const pdfBytes =
            await newPdf.save();

        const blob =
            new Blob(
                [pdfBytes],
                {type:"application/pdf"}
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;
        link.download = "Toolraho-Split-PDF.pdf";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        message.textContent =
            "✅ PDF created successfully! Download started.";

    }catch(error){

        console.error(error);

        message.textContent =
            "❌ Something went wrong. Please try another PDF.";

    }

    splitBtn.disabled = false;
});
</script>

</body>
</html>
